[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = 'black'
line_length = 100
known_first_party = ['apps', 'config']

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
ignore = [
    'RUF012', 'C408',  # Django Meta/serializer class attrs, and tests' dict(**kwargs) merge helper
]
exclude = ['**/migrations/*.py']
