services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: zattia
      POSTGRES_USER: zattia_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zattia_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application
    env_file: .env
    environment:
      DATABASE_URL: postgres://zattia_app:${POSTGRES_PASSWORD:-changeme}@db:5432/zattia
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
